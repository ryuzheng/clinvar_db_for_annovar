name: Update Clinvar database for ANNOVAR

on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        genome: ["hg19", "hg38"]

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
          submodules: "true"

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      # The output directory is no longer kept in the repository; create it
      # on the ephemeral runner so the update script has somewhere to write.
      - name: Prepare output directory
        run: mkdir -p "Clinvar_build/${{ matrix.genome }}"

      - name: Update Clinvar with GRCh37
        if: matrix.genome == 'hg19'
        run: |
          cd ./update_annovar_db
          python3 ./update_resources.py -d clinvar -w -hp ../Clinvar_build/hg19 -a ../ANNOVAR_script -g GRCh37

      - name: Update Clinvar with GRCh38
        if: matrix.genome == 'hg38'
        run: |
          cd ./update_annovar_db
          python3 ./update_resources.py -d clinvar -w -hp ../Clinvar_build/hg38 -a ../ANNOVAR_script -g GRCh38

      # Generated data lives only in the ephemeral runner workspace and is
      # passed to the release job as build artifacts. It is NEVER committed.
      #
      # On runs where ClinVar has no new version, the update script exits
      # early and produces no file, so we must NOT fail the job in that case.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.genome }}
          path: |
            Clinvar_build/${{ matrix.genome }}/*.gz
            Clinvar_build/${{ matrix.genome }}/*.ver
          if-no-files-found: warn
          retention-days: 1

  release:
    runs-on: ubuntu-26.04
    needs: build

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Prepare output directories
        run: |
          set -e
          mkdir -p Clinvar_build/hg19 Clinvar_build/hg38

      - name: Download artifacts for GRCh37
        id: dl19
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: "hg19"
          path: ./Clinvar_build/hg19

      - name: Download artifacts for GRCh38
        id: dl38
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: "hg38"
          path: ./Clinvar_build/hg38

      # ---------------------------------------------------------------------
      # Decide whether this run actually produced NEW data.
      #
      # ClinVar updates roughly once a week, but this workflow runs twice a
      # day.  Every run regenerates the database files, so most runs produce
      # identical *data* to the previous release.  Publishing a release every
      # time would be pure noise (and waste release storage).
      #
      # IMPORTANT: we must compare the DECOMPRESSED content, because gzip
      # embeds a timestamp in its header, so two runs over identical data
      # produce byte-different *.gz files.  We therefore compare the SHA-256
      # of `zcat <file>` for each freshly generated *.gz against the same
      # file name in the newest existing release.  If all match -> nothing
      # new -> skip releasing.
      # ---------------------------------------------------------------------
      - name: Detect whether new data differs from last release
        id: diff
        run: |
          set -euo pipefail
          shopt -s nullglob

          # SHA-256 of decompressed content (data identity, ignoring gzip
          # timestamp/compression-level differences).
          content_sha() { gunzip -c "$1" | sha256sum | awk '{print $1}'; }

          files=(Clinvar_build/hg19/*.gz Clinvar_build/hg38/*.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No database files produced this run (ClinVar unchanged); skipping release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # -------------------------------------------------------------------
          # Gather the release history ONCE, failing loudly on any API error.
          #
          # The previous implementation iterated `gh release list` and probed
          # each release with `gh release view ... 2>/dev/null | grep`. That is
          # why a duplicate release was published on 2026-11-16: a transient
          # failure on the probe for `tag-2026-11-09` was swallowed by
          # 2>/dev/null, so the loop silently fell through to the older
          # `tag-2026-11-02` (which carries the previous ClinVar version), and
          # the current `20261108` data then looked "new".
          #
          # We now fetch every release with its asset names in one paginated
          # call. Any error aborts the step (no silent fallthrough), and the
          # baseline is chosen by an explicit published_at sort rather than by
          # `gh release list`'s implicit (created_at) ordering — which is
          # fragile for releases whose created_at and published_at differ.
          # -------------------------------------------------------------------
          releases_json="$(mktemp)"
          if ! gh api --paginate \
                 -H "Accept: application/vnd.github+json" \
                 "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$releases_json"; then
            echo "::error::Failed to list releases from the GitHub API; aborting to avoid a wrong dedup decision."
            rm -f "$releases_json"
            exit 1
          fi

          # Emit "published_at<TAB>tag<TAB>name1,name2,..." for every NON-draft
          # release that carries at least one .gz asset, sorted newest first by
          # published_at (falls back to created_at when published_at is empty,
          # which happens for drafts/never-published entries we skip anyway).
          release_rows_file="$(mktemp)"
          if ! python3 - "$releases_json" > "$release_rows_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              rels = json.load(fh)
          rows = []
          for r in rels:
              if r.get("draft"):
                  continue
              names = [a["name"] for a in r.get("assets", []) if a.get("name", "").endswith(".gz")]
              if not names:
                  continue
              ts = r.get("published_at") or r.get("created_at") or ""
              rows.append((ts, r.get("tag_name", ""), ",".join(sorted(names))))
          rows.sort(key=lambda x: x[0], reverse=True)
          for ts, tag, names in rows:
              print(f"{ts}\t{tag}\t{names}")
          PY
          then
            echo "::error::Failed to parse release list JSON."
            rm -f "$releases_json" "$release_rows_file"
            exit 1
          fi

          if [ ! -s "$release_rows_file" ]; then
            echo "No existing release carries .gz assets; this is the first publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            rm -f "$releases_json" "$release_rows_file"
            exit 0
          fi

          # Baseline (for logging / content comparison) = newest release by
          # published_at that has .gz assets.
          IFS=$'\t' read -r PREV_TS PREV_TAG _ < "$release_rows_file" || true
          echo "Newest release with assets (by published_at): $PREV_TAG (published ${PREV_TS})"

          # Robust dedup: this run's data version is identified by the embedded
          # file name(s) (hg19_/hg38_clinvar_YYYYMMDD...). If ANY non-draft
          # release already carries ALL of the freshly generated file names,
          # the same data version has been published before — regardless of
          # release ordering. Pick the newest such release as the comparison
          # baseline so the decision never depends on which release happens to
          # sit at the top of the list.
          BASELINE_TAG=""
          while IFS=$'\t' read -r _tag_ts tag names; do
            [ -n "$tag" ] || continue
            have_all=true
            # Split the comma-separated asset names into a bash array
            # (portable: avoid `read -ra`, which bash 3.2 lacks).
            have=()
            rest="$names,"
            while [ -n "$rest" ]; do
              have+=("${rest%%,*}")
              rest="${rest#*,}"
            done
            for f in "${files[@]}"; do
              name="$(basename "$f")"
              match=false
              for h in "${have[@]}"; do
                if [ "$h" = "$name" ]; then match=true; break; fi
              done
              if [ "$match" = "false" ]; then have_all=false; break; fi
            done
            if [ "$have_all" = "true" ]; then
              BASELINE_TAG="$tag"
              break   # rows are newest-first, so first match is the newest
            fi
          done < "$release_rows_file"
          rm -f "$release_rows_file"

          publish=false
          if [ -z "$BASELINE_TAG" ]; then
            echo "No existing release already contains all generated file names -> new ClinVar version."
            publish=true
          else
            echo "All generated file names already exist in release: $BASELINE_TAG"
            # Confirm the DECOMPRESSED content is truly identical (gzip embeds
            # a timestamp, so raw *.gz bytes always differ run to run).
            echo "Verifying decompressed content against $BASELINE_TAG."
            tmp="$(mktemp -d)"
            if ! gh release download "$BASELINE_TAG" --repo "$GITHUB_REPOSITORY" \
                   --dir "$tmp" --pattern '*.gz' --clobber; then
              echo "::error::Failed to download assets from $BASELINE_TAG for content comparison."
              rm -rf "$tmp" "$releases_json"
              exit 1
            fi
            changed=false
            for f in "${files[@]}"; do
              name="$(basename "$f")"
              if [ ! -f "$tmp/$name" ]; then
                echo "  MISSING in baseline: $name -> treating as changed."
                changed=true
                continue
              fi
              new_sha="$(content_sha "$f")"
              old_sha="$(content_sha "$tmp/$name")"
              if [ "$new_sha" != "$old_sha" ]; then
                echo "  CHANGED:    $name (data differs despite same name)"
                changed=true
              else
                echo "  unchanged:  $name"
              fi
            done
            rm -rf "$tmp"
            if [ "$changed" = "true" ]; then
              publish=true
            fi
          fi

          rm -f "$releases_json"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = "true" ]; then
            echo "Result: new/changed data detected -> will publish a release."
          else
            echo "Result: identical to the release that already holds this data ($BASELINE_TAG) -> skip release (nothing to publish)."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Resolve release tag (unique per run)
        if: steps.diff.outputs.publish == 'true'
        id: tag
        run: |
          set -e
          DATE=$(date -u +'%Y-%m-%d')
          TAG="tag-${DATE}"
          # A scheduled run fires twice a day; make the second run of the day
          # unique instead of failing on an existing tag/release. The suffix
          # only affects the tag (and therefore the release name), keeping the
          # historical `tag-YYYY-MM-DD` / `release-YYYY-MM-DD` shape for the
          # first run of each day, exactly like tag-2026-11-09 / release-2026-11-09.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG="tag-${DATE}-$(date -u +'%H%M')"
          fi
          # Release name mirrors the historical format: `release-<tag without the
          # leading 'tag-'>` => release-2026-11-09 (not release-tag-2026-11-09).
          NAME="release-${TAG#tag-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG (name: $NAME)"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Create Github Release with generated database
        if: steps.diff.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          # Description matches the historical releases: the release/tag date
          # line, followed by the standard "Apply automatic changes" note.
          body: |
            ${{ steps.tag.outputs.tag }}

            Apply automatic changes
          files: |
            Clinvar_build/hg19/*.gz
            Clinvar_build/hg38/*.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
