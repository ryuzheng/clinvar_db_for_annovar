name: Update Clinvar database for ANNOVAR

on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        genome: ["hg19", "hg38"]

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
          submodules: "true"

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      # The output directory is no longer kept in the repository; create it
      # on the ephemeral runner so the update script has somewhere to write.
      - name: Prepare output directory
        run: mkdir -p "Clinvar_build/${{ matrix.genome }}"

      - name: Update Clinvar with GRCh37
        if: matrix.genome == 'hg19'
        run: |
          cd ./update_annovar_db
          python3 ./update_resources.py -d clinvar -w -hp ../Clinvar_build/hg19 -a ../ANNOVAR_script -g GRCh37

      - name: Update Clinvar with GRCh38
        if: matrix.genome == 'hg38'
        run: |
          cd ./update_annovar_db
          python3 ./update_resources.py -d clinvar -w -hp ../Clinvar_build/hg38 -a ../ANNOVAR_script -g GRCh38

      # Generated data lives only in the ephemeral runner workspace and is
      # passed to the release job as build artifacts. It is NEVER committed.
      #
      # On runs where ClinVar has no new version, the update script exits
      # early and produces no file, so we must NOT fail the job in that case.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.genome }}
          path: |
            Clinvar_build/${{ matrix.genome }}/*.gz
            Clinvar_build/${{ matrix.genome }}/*.ver
          if-no-files-found: warn
          retention-days: 1

  release:
    runs-on: ubuntu-26.04
    needs: build

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Prepare output directories
        run: |
          set -e
          mkdir -p Clinvar_build/hg19 Clinvar_build/hg38

      - name: Download artifacts for GRCh37
        id: dl19
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: "hg19"
          path: ./Clinvar_build/hg19

      - name: Download artifacts for GRCh38
        id: dl38
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: "hg38"
          path: ./Clinvar_build/hg38

      # ---------------------------------------------------------------------
      # Decide whether this run actually produced NEW data.
      #
      # ClinVar updates roughly once a week, but this workflow runs twice a
      # day.  Every run regenerates the database files, so most runs produce
      # identical *data* to the previous release.  Publishing a release every
      # time would be pure noise (and waste release storage).
      #
      # IMPORTANT: we must compare the DECOMPRESSED content, because gzip
      # embeds a timestamp in its header, so two runs over identical data
      # produce byte-different *.gz files.  We therefore compare the SHA-256
      # of `zcat <file>` for each freshly generated *.gz against the same
      # file name in the newest existing release.  If all match -> nothing
      # new -> skip releasing.
      # ---------------------------------------------------------------------
      - name: Detect whether new data differs from last release
        id: diff
        run: |
          set -euo pipefail
          shopt -s nullglob

          # SHA-256 of decompressed content (data identity, ignoring gzip
          # timestamp/compression-level differences).
          content_sha() { gunzip -c "$1" | sha256sum | awk '{print $1}'; }

          files=(Clinvar_build/hg19/*.gz Clinvar_build/hg38/*.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No database files produced this run (ClinVar unchanged); skipping release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Newest existing release that carries .gz assets (top of gh release list).
          PREV_TAG=""
          for t in $(gh release list --exclude-drafts --limit 15 --json tagName -q '.[].tagName'); do
            if gh release view "$t" --json assets -q '.assets[].name' 2>/dev/null | grep -q '\.gz$'; then
              PREV_TAG="$t"
              break
            fi
          done

          publish=false
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release with .gz assets found; this is the first publish."
            publish=true
          else
            echo "Comparing against previous release: $PREV_TAG"

            # Fast path: the generated file name embeds the ClinVar data
            # release date (from the NCBI FTP listing), not today's date.
            # A genuinely new ClinVar version therefore yields a file name
            # that is not among the previous release's assets.  If any new
            # file name is absent from the previous release, it is new data;
            # we can decide without downloading the large old assets.
            prev_names="$(gh release view "$PREV_TAG" --json assets -q '.assets[].name')"
            new_name=false
            for f in "${files[@]}"; do
              name="$(basename "$f")"
              if ! grep -qxF "$name" <<<"$prev_names"; then
                echo "  NEW FILE:   $name (not in previous release)"
                new_name=true
              fi
            done

            if [ "$new_name" = "true" ]; then
              publish=true
            else
              # All file names already exist in the previous release. This is
              # the common case for the twice-daily runs within the same week.
              # Confirm the DECOMPRESSED content is truly identical (gzip
              # embeds a timestamp, so raw *.gz bytes always differ).
              echo "All files already present by name; verifying content."
              tmp="$(mktemp -d)"
              gh release download "$PREV_TAG" --dir "$tmp" --pattern '*.gz' --clobber
              changed=false
              for f in "${files[@]}"; do
                name="$(basename "$f")"
                new_sha="$(content_sha "$f")"
                old_sha="$(content_sha "$tmp/$name")"
                if [ "$new_sha" != "$old_sha" ]; then
                  echo "  CHANGED:    $name (data differs despite same name)"
                  changed=true
                else
                  echo "  unchanged:  $name"
                fi
              done
              rm -rf "$tmp"
              if [ "$changed" = "true" ]; then
                publish=true
              fi
            fi
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = "true" ]; then
            echo "Result: new/changed data detected -> will publish a release."
          else
            echo "Result: identical to previous release -> skip release (nothing to publish)."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Resolve release tag (unique per run)
        if: steps.diff.outputs.publish == 'true'
        id: tag
        run: |
          set -e
          DATE=$(date -u +'%Y-%m-%d')
          TAG="tag-${DATE}"
          # A scheduled run fires twice a day; make the second run of the day
          # unique instead of failing on an existing tag/release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG="tag-${DATE}-$(date -u +'%H%M')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Create Github Release with generated database
        if: steps.diff.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: release-${{ steps.tag.outputs.tag }}
          files: |
            Clinvar_build/hg19/*.gz
            Clinvar_build/hg38/*.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
